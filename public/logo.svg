<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0A121"/>
      <stop offset="100%" stop-color="#2F80ED"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background circle -->
  <circle cx="50" cy="50" r="45" fill="#121217" stroke="url(#g1)" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="50" cy="50" r="30" stroke="#2F80ED" stroke-width="1.5" stroke-opacity="0.3"/>
  <circle cx="50" cy="50" r="15" stroke="#F0A121" stroke-width="1.5" stroke-opacity="0.4"/>
  
  <!-- Connection lines -->
  <line x1="50" y1="50" x2="28" y2="30" stroke="#2F80ED" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="72" y2="32" stroke="#F0A121" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="50" x2="50" y2="76" stroke="#10b981" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="30" x2="72" y2="32" stroke="white" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 2"/>

  <!-- Satellite Nodes -->
  <circle cx="28" cy="30" r="7" fill="#2F80ED" filter="url(#glow)"/>
  <circle cx="28" cy="30" r="3" fill="#ffffff"/>

  <circle cx="72" cy="32" r="7" fill="#F0A121" filter="url(#glow)"/>
  <circle cx="72" cy="32" r="3" fill="#ffffff"/>

  <circle cx="50" cy="76" r="6" fill="#10b981" filter="url(#glow)"/>
  <circle cx="50" cy="76" r="2.5" fill="#ffffff"/>

  <!-- Central Node -->
  <circle cx="50" cy="50" r="10" fill="url(#g1)" filter="url(#glow)"/>
  <circle cx="50" cy="50" r="4.5" fill="#09090b"/>
</svg>
